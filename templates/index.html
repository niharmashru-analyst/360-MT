<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT 360</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--bg:#f3f2f2;--p:#fff;--t:#181818;--m:#706e6b;--l:#dddbda;--a:#04844b;--r:#ea001e;--o:#fe9339;--v:#5867e8;--blue:#0176d3;--navy:#032d60}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:var(--t)}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:#cfe1f0;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #021f42}.logo{font-size:22px;font-weight:900;color:#fff;padding:4px 10px;letter-spacing:.04em}.logo::after{content:"";display:block;width:28px;height:3px;background:var(--blue);margin:6px 10px 0;border-radius:2px}.cap{font-size:11px;color:#9db9d6;padding:0 10px 14px}.nt{font-size:10px;color:#7fb1e0;text-transform:uppercase;letter-spacing:.12em;padding:12px 10px 5px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px;border-radius:8px;font-weight:650;cursor:pointer;transition:.15s}.nav button:hover{background:#06356e;color:#fff}.nav button.active{background:var(--blue);color:#fff}.content{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--l);box-shadow:0 2px 2px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:3}.title{font-size:20px;font-weight:850}.sub{font-size:11px;color:var(--m);margin-top:3px}.top button{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:9px 14px;border-radius:4px;font-weight:600;cursor:pointer;transition:.15s}.top button:hover{background:#014486;border-color:#014486}main{padding:16px;max-width:1550px;margin:auto}.filters{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:11px}.filters select{width:100%;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fff}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:13px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.kpis .card{border-top:3px solid var(--blue)}.lab{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.07em}.val{font-size:21px;font-weight:850;margin-top:5px}.mini{font-size:11px;color:var(--m);margin-top:3px}.sec{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.head h2{font-size:15px;margin:0}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pulse{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chart{height:300px}.small{height:255px}.tbl{overflow:auto;max-height:420px;border:1px solid var(--l);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--l);white-space:nowrap;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f8fafc;position:sticky;top:0}.red{color:var(--r);font-weight:800}.orange{color:var(--o);font-weight:800}.green{color:var(--a);font-weight:800}.purple{color:var(--v);font-weight:800}.mobile{display:none}@media(max-width:1100px){.filters{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}.grid2,.grid3{grid-template-columns:1fr}.pulse{grid-template-columns:1fr 1fr}}@media(max-width:700px){.side{position:fixed;left:-240px;z-index:10;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}main{padding:9px}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;color:var(--m);text-align:center}.loading.error{color:var(--r)}.spinner{width:34px;height:34px;border:3px solid var(--l);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}.spin-icon{display:inline-block;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.top button:disabled{opacity:.6;cursor:not-allowed}
</style></head><body><div class="app"><aside class="side" id="side"><div class="logo">MT 360</div><div class="cap">Modern Trade Intelligence</div><div class="nav">
<div class="nt">Executive</div><button class="active" data-p="overview">▣ Executive Overview</button>
<div class="nt">Sales & Market</div><button data-p="sales">↗ Sales Performance</button><button data-p="retailer">▣ Retailer 360</button><button data-p="product">◆ Product & Category</button>
<div class="nt">Distribution & Inventory</div><button data-p="inventory">▤ Stock Health</button><button data-p="distribution">◉ Distribution</button>
<div class="nt">Commercial</div><button data-p="commercial">₹ Target & Margin</button><button data-p="flow">⇄ Primary → Tertiary</button>
<div class="nt">Business Intelligence</div><button data-p="opportunity">⚡ Leakage & Opportunities</button><button data-p="actions">✓ Action Center</button>
<div class="nt">Tools</div><button data-p="analyst">🤖 MT Analyst</button><button data-p="health">⚙ Data Health</button>
</div></aside><section class="content"><header class="top"><div><button class="mobile" id="menu">☰</button> <span class="title" id="title">Executive Overview</span><div class="sub">Modern Trade 360 · Cosmetics</div></div><button id="refresh">↻ Refresh Data</button></header><main><div id="filters" class="filters"></div><div id="app"></div></main></section></div><script>
const $=x=>document.getElementById(x),M=v=>{v=+v||0;return"₹"+(Math.abs(v)>=1e7?(v/1e7).toFixed(2)+" Cr":Math.abs(v)>=1e5?(v/1e5).toFixed(2)+" L":Math.round(v).toLocaleString("en-IN"))},N=v=>(+v||0).toLocaleString("en-IN",{maximumFractionDigits:0}),P=v=>(+v||0).toFixed(1)+"%";let page="overview",opt={};const titles={overview:"Executive Overview",sales:"Sales Performance",retailer:"Retailer 360",product:"Product & Category",inventory:"Stock Health",distribution:"Distribution",commercial:"Target & Margin",flow:"Primary → Tertiary Flow",opportunity:"Leakage & Opportunities",actions:"Action Center",analyst:"MT Analyst",health:"Data Health"};const fs=[["chain_name","Chain"],["chain_type","Chain Type"],["region","Region"],["state","State"],["city","City"],["brand","Brand"],["category","Category"],["sub_category","Sub Category"],["pareto","Pareto"],["status","Status"]];
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function loadingHTML(msg){return `<div class="loading"><div class="spinner"></div><div>${msg||"Loading data…"}</div></div>`}function errorHTML(msg){return `<div class="loading error">⚠ ${esc(msg||"Something went wrong")}<br><button onclick="render()" style="margin-top:8px;padding:8px 14px;border:1px solid var(--l);border-radius:8px;background:#fff;cursor:pointer">Retry</button></div>`}async function opts(){opt=await(await fetch("/api/options")).json();$("filters").innerHTML=fs.map(([k,l])=>`<select id="f_${k}" title="${l}"><option>All</option>${(opt[k]||[]).map(x=>`<option>${esc(x)}</option>`).join("")}</select>`).join("");document.querySelectorAll(".filters select").forEach(x=>x.onchange=render)}function qs(){return[...document.querySelectorAll(".filters select")].map(x=>`f_${x.id.slice(2)}=${encodeURIComponent(x.value)}`).join("&")}
function cards(k){return`<div class="kpis">${[['Sales',M(k.sales),'Latest month'],['Growth',P(k.growth),'vs LY'],['Target Achievement',P(k.ach),'Sales / target'],['Sales Qty',N(k.qty),'Units'],['Stock Qty',N(k.stock),'Current'],['Stock Value',M(k.stock_value),'Qty × MRP'],['NOD',(+k.nod||0).toFixed(1),'Days cover'],['OOS',P(k.oos),'Zero-stock rows']].map(a=>`<div class="card"><div class="lab">${a[0]}</div><div class="val">${a[1]}</div><div class="mini">${a[2]}</div></div>`).join("")}</div>`}
function chart(id,rows,key){if(!rows?.length){$(id).innerHTML="No data";return}Plotly.react(id,[{type:"bar",orientation:"h",x:rows.map(r=>+r.sales||0).reverse(),y:rows.map(r=>String(r[key]??"Unknown")).reverse(),hovertemplate:"%{y}<br>₹%{x:,.0f}<extra></extra>",marker:{color:"#0176d3"}}],{margin:{l:105,r:10,t:5,b:30},paper_bgcolor:"transparent",plot_bgcolor:"transparent",font:{size:11}},{displayModeBar:false,responsive:true})}
function tr(id,r){Plotly.react(id,[{x:r.map(x=>x.month),y:r.map(x=>x.sales),type:"scatter",mode:"lines+markers",name:"Sales",line:{color:"#0176d3",width:2.5},marker:{color:"#0176d3"}},{x:r.map(x=>x.month),y:r.map(x=>x.margin),type:"scatter",mode:"lines",name:"Margin",line:{color:"#04844b",width:2}}],{margin:{l:50,r:10,t:8,b:40},hovermode:"x unified",paper_bgcolor:"transparent",plot_bgcolor:"transparent",legend:{orientation:"h"}},{displayModeBar:false,responsive:true})}
function tbl(rows,cols){if(!rows?.length)return"No data";return`<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>"<tr>"+cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):esc(r[c[0]])}</td>`).join("")+"</tr>").join("")}</tbody></table>`}
function opp(rows){return tbl(rows,[["issue","Issue",v=>`<span class="${String(v).includes("OOS")?"red":String(v).includes("Excess")?"purple":String(v).includes("Distribution")?"green":"orange"}">${esc(v)}</span>`],["chain_name","Chain"],["outlet_name","Store"],["sku","SKU"],["sales","Sales",M],["stock","Stock",N],["velocity","Velocity",v=>(+v||0).toFixed(1)],["nod","NOD",v=>(+v||0).toFixed(1)],["distribution_pct","Distribution",v=>isNaN(+v)?"—":P(v)]])}
async function render(){ $("title").textContent=titles[page];if(page==="analyst"){analyst();return}if(page==="health"){health();return}$("app").innerHTML=loadingHTML();let ep=page==="overview"?"/api/dashboard":"/api/page/"+page,d,k,b;try{const res=await fetch(ep+"?"+qs());d=await res.json();if(!res.ok)throw new Error(d.error||"Failed to load data")}catch(e){$("app").innerHTML=errorHTML(e.message);return}k=d.kpis;b=cards(k);
if(page==="overview"){$("app").innerHTML=b+`<div class="sec"><div class="head"><h2>Executive Pulse</h2><span class="mini">What is happening, where, and what needs attention</span></div><div class="pulse"><div class="card"><b>Growth Driver</b><div class="mini">${esc(d.chains?.[0]?.chain_name||"—")} · ${M(d.chains?.[0]?.sales)}</div></div><div class="card"><b>Attention Area</b><div class="mini">${esc(d.chains?.at(-1)?.chain_name||"—")} · ${M(d.chains?.at(-1)?.sales)}</div></div><div class="card"><b>Inventory Signal</b><div class="mini">${(+k.nod||0).toFixed(1)} NOD · ${P(k.oos)} OOS</div></div><div class="card"><b>Distribution</b><div class="mini">${d.distribution.pct==null?"Not supplied":P(d.distribution.pct)} · ${N(d.distribution.gap)} gaps</div></div></div></div><div class="sec grid2"><div class="card"><h2>Sales & Margin Trend</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Retailer Performance</h2><div id="c2" class="small"></div></div></div><div class="sec grid3"><div class="card"><h2>Regions</h2><div id="c3" class="small"></div></div><div class="card"><h2>Categories</h2><div id="c4" class="small"></div></div><div class="card"><h2>Brands</h2><div id="c5" class="small"></div></div></div><div class="sec card"><div class="head"><h2>Priority Business Issues</h2></div><div class="tbl">${opp(d.opportunities)}</div></div>`;tr("c1",d.trend);chart("c2",d.chains,"chain_name");chart("c3",d.regions,"region");chart("c4",d.categories,"category");chart("c5",d.brands,"brand");return}
let body="";const T=d.tables||{};if(page==="sales")body=`<div class="grid2"><div class="card"><h2>Sales Trend</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Chains</h2><div id="c2" class="small"></div></div></div><div class="sec grid3"><div class="card"><h2>Regions</h2><div id="c3" class="small"></div></div><div class="card"><h2>Cities</h2><div id="c4" class="small"></div></div><div class="card"><h2>Categories</h2><div id="c5" class="small"></div></div></div>`;else if(page==="retailer")body=`<div class="grid2"><div class="card"><h2>Retailers</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Stores</h2><div class="tbl">${tbl(T.outlet_name,[["outlet_name","Store"],["sales","Sales",M],["qty","Qty",N],["stock","Stock",N],["growth","Growth",P]])}</div></div></div>`;else if(page==="product")body=`<div class="grid2"><div class="card"><h2>Category</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Brand</h2><div id="c2" class="small"></div></div></div><div class="sec card"><h2>SKU Performance</h2><div class="tbl">${tbl(T.sku,[["sku","SKU"],["sales","Sales",M],["qty","Qty",N],["stock","Stock",N],["growth","Growth",P],["margin_pct","Margin",P]])}</div></div>`;else if(["inventory","opportunity","actions"].includes(page))body=`<div class="sec card"><div class="head"><h2>${page==="inventory"?"Inventory Exceptions":page==="actions"?"Action Center":"Leakage & Opportunities"}</h2></div><div class="tbl">${opp(d.opportunities)}</div></div>`;else if(page==="distribution")body=`<div class="pulse"><div class="card"><b>Distribution</b><div class="val">${d.distribution.pct==null?"—":P(d.distribution.pct)}</div></div><div class="card"><b>Distribution Gaps</b><div class="val">${N(d.distribution.gap)}</div></div><div class="card"><b>OOS</b><div class="val">${P(k.oos)}</div></div><div class="card"><b>NOD</b><div class="val">${(+k.nod||0).toFixed(1)}</div></div></div><div class="sec grid2"><div class="card"><h2>Chain Distribution</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Opportunity Queue</h2><div class="tbl">${opp(d.opportunities)}</div></div></div>`;else if(page==="commercial")body=`<div class="grid2"><div class="card"><h2>Chain Performance</h2><div id="c1" class="chart"></div></div><div class="card"><h2>Target & Margin</h2><div class="tbl">${tbl(T.chain_name,[["chain_name","Chain"],["sales","Sales",M],["target","Target",M],["ach","Achievement",P],["margin_pct","Margin",P]])}</div></div></div>`;else body=`<div class="card"><h2>Primary → Tertiary → Stock</h2><p class="mini">Primary, Tertiary, Opening Stock and Closing Stock are loaded as separate source datasets. Replace the dummy workbooks with actual Monday data to activate reconciliation.</p><div id="c1" class="chart"></div></div>`;
$("app").innerHTML=b+`<div class="sec">${body}</div>`;if(page==="sales"){tr("c1",d.trend);chart("c2",T.chain_name,"chain_name");chart("c3",T.region,"region");chart("c4",T.city,"city");chart("c5",T.category,"category")}if(page==="retailer")chart("c1",T.chain_name,"chain_name");if(page==="product"){chart("c1",T.category,"category");chart("c2",T.brand,"brand")}if(page==="distribution"||page==="commercial")chart("c1",T.chain_name,"chain_name");if(page==="flow")tr("c1",d.trend)}
function analyst(){$("app").innerHTML=`<div class="card"><h2>🤖 MT Analyst</h2><p class="mini">AI-ready workspace. The data engine already exposes MT metrics for future natural-language analysis.</p><div class="grid3">${["Why did sales move?","Where are OOS risks?","Which SKUs need distribution?","Where is excess stock?","Which retailers are under target?","What should sales fix first?"].map(x=>`<button style="padding:18px;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:9px;font-weight:700">${x}</button>`).join("")}</div></div>`}
async function health(){$("app").innerHTML=loadingHTML();let d;try{const res=await fetch("/api/health");d=await res.json();if(!res.ok)throw new Error(d.error||"Failed to load")}catch(e){$("app").innerHTML=errorHTML(e.message);return}const errs=d.errors||{};const errBlock=Object.keys(errs).length?`<div class="card" style="margin-top:10px;border-color:var(--r)"><h2 style="color:var(--r)">Issues</h2>${Object.entries(errs).map(([k,v])=>`<div style="padding:8px 0;border-bottom:1px solid var(--l)"><b>${esc(k)}</b><div class="mini" style="margin-top:2px">${esc(v)}</div></div>`).join("")}</div>`:"";$("app").innerHTML=`<div class="card"><h2>Data Health</h2><p class="mini">Rows loaded by source. This is useful when connecting OneDrive files.</p><div class="tbl">${tbl(Object.entries(d.datasets).map(x=>({dataset:x[0],rows:x[1],status:x[1]?"Loaded":"Missing"})),[["dataset","Dataset"],["rows","Rows",N],["status","Status",v=>`<span class="${v==="Loaded"?"green":"red"}">${v}</span>`]])}</div></div>${errBlock}`}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");page=b.dataset.p;$("side").classList.remove("open");render()});$("menu").onclick=()=>$("side").classList.toggle("open");let refreshing=false;$("refresh").onclick=async()=>{if(refreshing)return;refreshing=true;const btn=$("refresh"),orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin-icon">↻</span> Refreshing…';try{const res=await fetch("/api/refresh");const j=await res.json();if(!res.ok||j.error)throw new Error(j.error||"Refresh failed");await render()}catch(e){alert("Refresh failed: "+e.message)}finally{btn.disabled=false;btn.innerHTML=orig;refreshing=false}};opts().then(render);
</script></body></html>
