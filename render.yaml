services:
  - type: web
    name: mt360-modern-trade
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --timeout 180 --max-requests 50 --max-requests-jitter 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CACHE_MINUTES
        value: 10
