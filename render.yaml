services:
  - type: web
    name: mt360-modern-trade
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --timeout 120 --max-requests 100 --max-requests-jitter 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: CACHE_MINUTES
        value: 10
